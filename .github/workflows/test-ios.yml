
name: Run unit and ui tests
on:
  push:
  workflow_call:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Ruby 3.3.5
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true
          
      - name: Setup xcodegen and init xcode project
        uses: xavierLowmiller/xcodegen-action@1.2.4
        with:
          spec: project.yml
          use-cache: true
          quiet: true
          version: 2.42.0
          
      - name: Check dependencies
        run: |
          xcodegen --version
          xcodebuild -version
          ruby --version

      - name: Run tests with fastlane
        run: bundle exec fastlane test
